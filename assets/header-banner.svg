<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180" fill="none">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>

    <!-- Subtle Accent Ambient Glow -->
    <radialGradient id="cyanGlow" cx="10%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="90%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262d" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: 2px;
      fill: url(#nameGradient);
    }
    .role-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 3.5px;
      fill: #58a6ff;
      text-transform: uppercase;
    }
    .prompt-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      fill: #8b949e;
    }
    .prompt-highlight {
      fill: #3fb950;
      font-weight: 600;
    }
    .domain-tag {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      fill: #7d8590;
    }
  </style>

  <!-- Container Box -->
  <rect x="1.5" y="1.5" width="897" height="177" rx="12" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="897" height="177" rx="12" fill="url(#techGrid)"/>
  <rect x="1.5" y="1.5" width="897" height="177" rx="12" fill="url(#cyanGlow)"/>
  <rect x="1.5" y="1.5" width="897" height="177" rx="12" fill="url(#blueGlow)"/>
  <rect x="1.5" y="1.5" width="897" height="177" rx="12" stroke="url(#borderGlow)" stroke-width="1.2"/>

  <!-- Left Header Status Dots -->
  <g transform="translate(40, 36)">
    <circle cx="0" cy="0" r="4.5" fill="#f85149" opacity="0.85"/>
    <circle cx="15" cy="0" r="4.5" fill="#e3b341" opacity="0.85"/>
    <circle cx="30" cy="0" r="4.5" fill="#3fb950" opacity="0.85"/>
  </g>

  <!-- Terminal Command Prompt Accent -->
  <g transform="translate(95, 36)">
    <text x="0" y="4" class="prompt-text"><tspan class="prompt-highlight">~</tspan> soheil.build(<tspan fill="#e6edf3">"production-systems"</tspan>)</text>
  </g>

  <!-- Main Name -->
  <text x="40" y="90" class="name-text">SOHEIL VATANDOUST</text>

  <!-- Role Subtitle -->
  <text x="40" y="116" class="role-text">Software Architect &amp; Product Engineer</text>

  <!-- Domain Highlights Line -->
  <g transform="translate(40, 148)">
    <text x="0" y="0" class="domain-tag">
      <tspan fill="#38bdf8">&#9670;</tspan> Android Ecosystem &#160;&#160;
      <tspan fill="#58a6ff">&#9670;</tspan> Distributed &amp; Cloudflare Edge &#160;&#160;
      <tspan fill="#3fb950">&#9670;</tspan> High-Performance Systems &#160;&#160;
      <tspan fill="#e3b341">&#9670;</tspan> Full-Stack Next.js
    </text>
  </g>

  <!-- Right Decorative Architecture Monogram / Vector Accent -->
  <g transform="translate(770, 90)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="28" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <path d="M-8 -8 L8 8 M-8 8 L8 -8" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#58a6ff"/>
    <circle cx="42" cy="0" r="3.5" fill="#38bdf8"/>
    <circle cx="-30" cy="-30" r="3" fill="#3fb950"/>
    <circle cx="-20" cy="37" r="3" fill="#e3b341"/>
  </g>
</svg>
