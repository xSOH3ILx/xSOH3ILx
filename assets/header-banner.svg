<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111822" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <!-- Subtle Glow Gradient -->
    <radialGradient id="glow" cx="82%" cy="52%" r="35%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30363d" stroke-width="0.6" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Main Card Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />
  <rect width="1200" height="280" rx="16" fill="url(#grid)" />
  <rect width="1200" height="280" rx="16" fill="url(#glow)" />

  <!-- macOS Window Controls -->
  <g transform="translate(36, 36)">
    <circle cx="0" cy="0" r="6.5" fill="#ff5f56" />
    <circle cx="22" cy="0" r="6.5" fill="#ffbd2e" />
    <circle cx="44" cy="0" r="6.5" fill="#27c93f" />
    <text x="68" y="4" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="0.5">soheil@architecture:~</text>
  </g>

  <!-- Typography Section (Native SVG Text for 100% Render Compatibility) -->
  <g transform="translate(56, 118)">
    <!-- Name -->
    <text x="0" y="0" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="0.5">
      Soheil Vatandoust
    </text>

    <!-- Role / Title -->
    <text x="0" y="38" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0.3">
      Software Architect & Product Engineer
    </text>

    <!-- Terminal Tech Stack Line -->
    <text x="0" y="82" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14.5">
      <tspan fill="#3fb950" font-weight="bold">➜</tspan>
      <tspan fill="#79c0ff"> ~/stack</tspan>
      <tspan fill="#8b949e"> $ </tspan>
      <tspan fill="#d2a8ff">Enterprise Systems</tspan>
      <tspan fill="#484f58"> • </tspan>
      <tspan fill="#a5d6ff">Full-Stack Web</tspan>
      <tspan fill="#484f58"> • </tspan>
      <tspan fill="#ff7b72">High-Performance Go/Rust</tspan>
      <tspan fill="#484f58"> • </tspan>
      <tspan fill="#7ee787">Native Android</tspan>
    </text>
  </g>

  <!-- Right Orbital Graphic -->
  <g transform="translate(1015, 145)">
    <!-- Outer Dashed Orbit -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 6" />
    
    <!-- Inner Solid Ring -->
    <circle cx="0" cy="0" r="42" fill="#0d1117" fill-opacity="0.7" stroke="#388bfd" stroke-width="2.5" />

    <!-- Orbital Nodes -->
    <circle cx="-46" cy="-50" r="4.5" fill="#3fb950" />
    <circle cx="68" cy="2" r="5" fill="#388bfd" />
    <circle cx="-22" cy="64" r="4.5" fill="#d29922" />

    <!-- Center Node & Crosshair -->
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="-12" x2="-12" y2="12" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6.5" fill="#58a6ff" />
  </g>
</svg>
