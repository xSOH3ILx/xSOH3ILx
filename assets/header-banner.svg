<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 1.5px;
      fill: url(#titleGradient);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 3px;
      fill: #8b949e;
      text-transform: uppercase;
    }
    .persian-motto {
      font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
      font-weight: 600;
      font-size: 16px;
      fill: #e6edf3;
      direction: rtl;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.5px;
      fill: #58a6ff;
    }
  </style>

  <!-- Container Box with Rounded Corners and Subtle Border -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#bgGradient)"/>
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#grid)"/>
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#glowLeft)"/>
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#glowRight)"/>
  <rect x="2" y="2" width="896" height="216" rx="14" stroke="url(#borderGradient)" stroke-width="1.2"/>

  <!-- Left Accent Tech Indicator -->
  <g transform="translate(45, 45)">
    <!-- Terminal-like decorative dots -->
    <circle cx="0" cy="0" r="5" fill="#f85149" opacity="0.8"/>
    <circle cx="16" cy="0" r="5" fill="#e3b341" opacity="0.8"/>
    <circle cx="32" cy="0" r="5" fill="#3fb950" opacity="0.8"/>
  </g>

  <!-- Main Identity Titles -->
  <text x="45" y="98" class="title">SOHEIL VATANDOUST</text>
  <text x="45" y="125" class="subtitle">Idea Maker &amp; Software Architect</text>

  <!-- Persian Slogan -->
  <text x="45" y="160" class="persian-motto">« مسئله رو می‌شناسم، راه‌حلش رو می‌سازم! »</text>

  <!-- Tech Focus Badges inside SVG -->
  <g transform="translate(45, 185)">
    <!-- Badge 1: Android & Mobile -->
    <rect x="0" y="0" width="115" height="20" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="57" y="14" text-anchor="middle" class="tag">Android &amp; Kotlin</text>

    <!-- Badge 2: Web & Full-Stack -->
    <rect x="125" y="0" width="125" height="20" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="187" y="14" text-anchor="middle" class="tag">Next.js &amp; TypeScript</text>

    <!-- Badge 3: Systems & Microservices -->
    <rect x="260" y="0" width="130" height="20" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="325" y="14" text-anchor="middle" class="tag">Go &amp; Rust &amp; FastAPI</text>

    <!-- Badge 4: Cloudflare & Edge -->
    <rect x="400" y="0" width="135" height="20" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="467" y="14" text-anchor="middle" class="tag">Cloudflare &amp; Linux</text>
  </g>

  <!-- Right Decorative Geometry / System Icon -->
  <g transform="translate(740, 110)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="32" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
    <path d="M-10 -10 L10 10 M-10 10 L10 -10" stroke="#79c0ff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    <!-- Orbiting nodes -->
    <circle cx="45" cy="0" r="4" fill="#58a6ff"/>
    <circle cx="-32" cy="-32" r="3.5" fill="#3fb950"/>
    <circle cx="-15" cy="42" r="3" fill="#e3b341"/>
  </g>
</svg>
