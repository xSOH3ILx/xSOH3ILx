name: Generate Contribution Snake

on:
  schedule:
    # اجرا در ساعت 20:30 UTC (معادل نیمه‌شب به وقت ایران) برای ثبت کامل کامیت‌های روز و دوری از ترافیک سرور
    - cron: "30 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Grid Snake
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0969da
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Deploy SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
